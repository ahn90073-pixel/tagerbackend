name: Deploy Tager backend to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tagerbackend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy tagerbackend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Worker
        run: npm run build

      - name: Apply Neon schema migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0001_initial.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0002_tenant_schemas.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0003_tenant_data_tables.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0004_storefront_checkout.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0005_firebase_google_merchant_auth.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0006_company_profile.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0007_company_profile_document_blobs.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0008_product_images_index.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0009_company_governorate.sql

      - name: Prepare Worker secrets file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const keys = ['DATABASE_URL', 'JWT_SECRET'];
          const missing = keys.filter((key) => !process.env[key]);
          if (missing.length) {
            throw new Error(`Missing required deployment secret(s): ${missing.join(', ')}`);
          }
          const values = Object.fromEntries(keys.map((key) => [key, process.env[key]]));
          fs.writeFileSync('/tmp/tagerbackend-worker-secrets.json', JSON.stringify(values), { mode: 0o600 });
          NODE

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --secrets-file /tmp/tagerbackend-worker-secrets.json

      - name: Remove temporary secrets file
        if: always()
        run: rm -f /tmp/tagerbackend-worker-secrets.json

      - name: Verify deployed Worker health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://tagerbackend.ahn90073.workers.dev/health
